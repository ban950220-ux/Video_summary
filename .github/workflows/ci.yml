name: Analyzer CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: analyzer-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run check
      - name: Install test audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: npm test
      - run: node --check dist/dashboard-worker.mjs
      - name: Confirm deployment remains blocked pending remote evidence
        shell: bash
        run: |
          set +e
          npm run release:gate
          gate_status=$?
          set -e
          if [ "$gate_status" -ne 2 ]; then
            echo "Unexpected release gate outcome; review configuration."
            exit 1
          fi
          echo "Offline tests passed. Cloudflare deployment is still BLOCKED."
