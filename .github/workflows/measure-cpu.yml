name: Measure CPU (manual)

# Manual, read-only. Prints aggregate CPU numbers of the production Worker from Cloudflare analytics.
# Uses the deploy secrets; the token needs "Account Analytics: Read". Never prints the account ID.
on:
  workflow_dispatch:
    inputs:
      hours:
        description: "최근 몇 시간을 볼지 (1~168)"
        required: false
        type: string
        default: "24"

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - name: Query analytics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HOURS: ${{ inputs.hours }}
        run: node scripts/v1-measure-cpu.mjs | tee -a "$GITHUB_STEP_SUMMARY"
