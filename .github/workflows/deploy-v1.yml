name: Deploy v1 (manual)

# Manual only. Push, pull request or merge never deploys.
# Requires repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID and owner approval
# per docs/v1/DEPLOY.md. Type the Worker name to confirm.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = 배포 리허설만 / deploy = 실제 배포 / measure = CPU 사용량 조회만 (읽기 전용)"
        required: true
        type: choice
        default: check
        options: [check, deploy, measure]
      confirm:
        description: "deploy일 때만: Worker 이름 holy-rice-b914 를 입력하세요"
        required: false
        type: string
      hours:
        description: "measure일 때만: 최근 몇 시간을 볼지 (1~168)"
        required: false
        type: string
        default: "24"
      bucket:
        description: "measure일 때만: 묶음 단위"
        required: false
        type: choice
        default: fifteen
        options: [fifteen, minute]

permissions:
  contents: read

concurrency:
  group: deploy-v1-production
  cancel-in-progress: false

jobs:
  # Read-only: aggregate CPU numbers of the production Worker from Cloudflare analytics. The token needs
  # "Account Analytics: Read". The script never prints the account ID or the raw response. It lives in
  # this workflow because a workflow file that is not on the default branch cannot be started by hand.
  measure:
    if: inputs.mode == 'measure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - name: Query analytics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HOURS: ${{ inputs.hours }}
          BUCKET: ${{ inputs.bucket }}
        run: |
          set -o pipefail
          node scripts/v1-measure-cpu.mjs | tee -a "$GITHUB_STEP_SUMMARY"

  deploy:
    if: inputs.mode != 'measure'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require typed confirmation for deploy
        if: inputs.mode == 'deploy'
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: test "$CONFIRM" = "holy-rice-b914"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - run: npm ci
      - run: npm run check
      - run: npm run test:v1
      - run: node scripts/v1-build-assets.mjs
      - name: Record D1 restore point (Time Travel bookmark) before deploying
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          npx wrangler d1 time-travel info youtube-ai-analyzer-private-db | tee d1-bookmark.log
          {
            echo "### D1 restore point before deploy"
            grep -iE "bookmark" d1-bookmark.log || echo "(see job log)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy rehearsal (no upload)
        run: npx wrangler deploy -c wrangler.v1.toml --dry-run --outdir dist/dry-run
      - name: Deploy
        if: inputs.mode == 'deploy'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          # Full wrangler output stays off the public log: its config-diff warning prints dashboard
          # variable values. Only the version/deployment IDs are shown.
          set +e
          npx wrangler deploy -c wrangler.v1.toml > deploy.log 2>&1
          status=$?
          set -e
          grep -E "Uploaded|Deployed|Current Version ID|Deployment ID" deploy.log | grep -v "https://" || true
          if [ "$status" -ne 0 ]; then echo "wrangler deploy failed (exit $status); full output withheld"; exit "$status"; fi
          {
            echo "### v1 deployment"
            echo "- Commit: \`$GITHUB_SHA\`"
            grep -E "Current Version ID|Deployment ID" deploy.log || true
          } >> "$GITHUB_STEP_SUMMARY"
