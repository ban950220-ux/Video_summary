name: Deploy v1 (manual)

# Manual only. Push, pull request or merge never deploys.
# Requires repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID and owner approval
# per docs/v1/DEPLOY.md. Type the Worker name to confirm.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "배포하려면 Worker 이름 holy-rice-b914 를 입력하세요"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-v1-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Require typed confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: test "$CONFIRM" = "holy-rice-b914"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - run: npm ci
      - run: npm run check
      - run: npm run test:v1
      - run: node scripts/v1-build-assets.mjs
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler deploy -c wrangler.v1.toml | tee deploy.log
          {
            echo "### v1 deployment"
            echo "- Commit: \`$GITHUB_SHA\`"
            grep -E "Current Version ID|Deployment ID" deploy.log || true
          } >> "$GITHUB_STEP_SUMMARY"
