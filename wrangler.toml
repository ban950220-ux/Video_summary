# Existing, Access-protected production Worker. Deploy only through npm run deploy:production.
name = "holy-rice-b914"
main = "src/site-worker.mjs"
compatibility_date = "2026-10-10"
workers_dev = true
preview_urls = false
keep_vars = true

[observability]
enabled = true

[assets]
directory = "./web/site"
binding = "ASSETS"
run_worker_first = true

[vars]
ENABLE_LIVE_FREE = "false"
ALLOW_PAID_API = "false"
SITE_DEPLOYED = "true"
# ACCESS_AUD and ACCESS_TEAM_DOMAIN stay in dashboard runtime variables.
# ACCESS_OWNER_EMAIL and KEY_ENCRYPTION_KEY_B64 stay in existing Worker Secrets.
# The deploy command must use --keep-vars; never put their values here.

[[d1_databases]]
binding = "DB"
database_name = "youtube-ai-analyzer-private-db"
database_id = "d7c1bd48-b0e1-4bb2-a7d7-2079d5e20b34"

# Previews must not receive the production D1 binding. Configure a separate
# preview database and Access values before enabling preview deployments.
[previews.vars]
ENABLE_LIVE_FREE = "false"
ALLOW_PAID_API = "false"
SITE_DEPLOYED = "false"
